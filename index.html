<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pagine interattive da compilare e condividere nei commenti.">
  <title>Il Tabellone</title>
  <style>
    :root { color-scheme: light; --blue: #0077c8; --blue-dark: #005fa3; --ink: #0f172a; --muted: #475569; --border: #e2e8f0; --surface: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #fff; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; }
    main { width: min(760px, 100% - 32px); margin: 0 auto; padding: 64px 0; }
    header { padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 42px); line-height: 1.15; letter-spacing: -.03em; }
    header p { margin: 12px 0 0; color: var(--muted); font-size: 17px; }
    section { margin-top: 32px; }
    h2 { margin: 0 0 14px; font-size: 19px; }
    .page-card { display: block; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
    .page-card:hover, .page-card:focus-visible { border-color: var(--blue); transform: translateY(-2px); outline: none; }
    .page-card strong { display: block; color: var(--blue-dark); font-size: 18px; }
    .page-card span { display: block; margin-top: 6px; color: var(--muted); }
    footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Il Tabellone</h1>
      <p>Esprimi il tuo giudizio, calcola il risultato e copialo per condividerlo nei commenti.</p>
    </header>
    <section aria-labelledby="pages-title">
      <h2 id="pages-title">Pagine disponibili</h2>
      <a class="page-card" href="pagine/il-tabellone-giovanni-manna.html">
        <strong>Il Tabellone di Giovanni Manna</strong>
        <span>Valuta le operazioni di mercato del Napoli e copia il tuo verdetto finale.</span>
      </a>
    </section>
    <footer>Le valutazioni vengono salvate nel browser che stai usando.</footer>
  </main>
</body>
</html>
