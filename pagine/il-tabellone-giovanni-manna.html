    function escapeHtml(str) {

    }
    function loadSavedVotes() {
      try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") {
          ALL_OPERATIONS.forEach(function(op) { var val = Number(parsed[op.id]); if (GRADES.indexOf(val) !== -1) votes[op.id] = val; });
        }
      } catch (e) { votes = {}; }
    }
    function persistVotes() { try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(votes)); } catch (e) {} }
    function getGradeTierClass(grade) {
      if (grade <= 4) return "tier-red";
      if (grade === 5) return "tier-orange";
      if (grade === 6) return "tier-amber";
      if (grade <= 8) return "tier-green";
      return "tier-emerald";
    }
    function buildOperationRowHtml(item) {
      var activeGrade = votes[item.id] || 0;
      var safePlayer = escapeHtml(item.player);

        var isActive = activeGrade === grade;
        var tierClass = getGradeTierClass(grade);

      container.innerHTML = MARKET_SESSIONS.map(function(session) {
        var sessionTotal = session.entrate.length + session.uscite.length;
        return '<section class="session-block" aria-labelledby="sec_' + session.id + '"><div class="session-divider"><h2 class="session-title" id="sec_' + session.id + '">' + escapeHtml(session.title) + '</h2><span class="session-meta">' + sessionTotal + ' operazioni</span></div><div class="sub-group"><div class="sub-header">' + escapeHtml(session.entrateLabel) + ' (' + session.entrate.length + ')</div>' + session.entrate.map(buildOperationRowHtml).join("") + '</div><div class="sub-group"><div class="sub-header">Uscite (' + session.uscite.length + ')</div>' + session.uscite.map(buildOperationRowHtml).join("") + '</div></section>';
      }).join("");
    }
    function toggleVote(opId, grade) {
      if (votes[opId] === grade) delete votes[opId]; else votes[opId] = grade;
      persistVotes();
      var row = document.getElementById("row_" + opId);
      if (row) {
        var current = votes[opId] || 0;
        var buttons = row.querySelectorAll(".vote-cell");
        for (var i = 0; i < buttons.length; i++) {
          var btn = buttons[i];
          var active = Number(btn.getAttribute("data-grade")) === current;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-pressed", active ? "true" : "false");
        }
      }
      renderVerdictBox();
    }
    function handleReset() {
      var btn = document.getElementById("resetBtn");
      if (!btn) return;
      if (!resetArmed) {
        resetArmed = true;
        btn.textContent = "Conferma azzeramento?";
        btn.classList.add("armed");
        clearTimeout(resetTimer);
        resetTimer = setTimeout(function() { resetArmed = false; btn.textContent = "Azzera voti"; btn.classList.remove("armed"); }, 3000);
      } else {
        clearTimeout(resetTimer);
        resetArmed = false;
        votes = {};
        persistVotes();
        btn.textContent = "Azzera voti";
        btn.classList.remove("armed");
        renderAllSessions();
        renderVerdictBox();
      }
    }
    function getJudgmentInfo(average) {
      if (average < 5.0) return { label: "Gravemente insufficiente", badgeClass: "bad" };
      if (average < 6.0) return { label: "Insufficiente", badgeClass: "warn" };
      if (average < 6.5) return { label: "Sufficiente", badgeClass: "ok" };
      if (average < 7.5) return { label: "Discreto", badgeClass: "good" };
      if (average < 8.5) return { label: "Buono", badgeClass: "good" };
      return { label: "Ottimo", badgeClass: "great" };
    }
    function calculateVerdictData() {
      var evaluatedCount = 0, sum = 0, positiveCount = 0, sufficientCount = 0, insufficientCount = 0;
      ALL_OPERATIONS.forEach(function(op) {
        var grade = votes[op.id];
        if (!grade) return;
        evaluatedCount++;
        sum += grade;
        if (grade >= 7) positiveCount++; else if (grade === 6) sufficientCount++; else insufficientCount++;
      });
      var totalCount = ALL_OPERATIONS.length;
      var average = evaluatedCount > 0 ? sum / evaluatedCount : 0;
      var formattedAverage = evaluatedCount > 0 ? average.toFixed(2).replace(".", ",") : "--";
      var info = evaluatedCount > 0 ? getJudgmentInfo(average) : { label: "In attesa di valutazioni", badgeClass: "muted" };
      return { evaluatedCount: evaluatedCount, totalCount: totalCount, formattedAverage: formattedAverage, judgment: info.label, badgeClass: info.badgeClass, positiveCount: positiveCount, sufficientCount: sufficientCount, insufficientCount: insufficientCount };
    }
    function renderVerdictBox() {
      var box = document.getElementById("verdictBox");
      if (!box) return;
      var data = calculateVerdictData();
      var hasVotes = data.evaluatedCount > 0;
      box.innerHTML = '<h2 class="verdict-heading">Verdetto finale</h2><div class="verdict-top"><span class="verdict-score">' + data.formattedAverage + ' / 10</span><span class="verdict-badge ' + data.badgeClass + '">' + escapeHtml(data.judgment) + '</span></div><div class="verdict-count">' + data.evaluatedCount + ' / ' + data.totalCount + ' operazioni valutate</div><div class="pills-row"><span class="stat-pill pos">Positive (7–10): ' + data.positiveCount + '</span><span class="stat-pill suf">Sufficienti (6): ' + data.sufficientCount + '</span><span class="stat-pill ins">Insufficienti (1–5): ' + data.insufficientCount + '</span></div><button type="button" id="copyBtn" class="btn-copy-x" onclick="copyVerdictText()"' + (hasVotes ? '' : ' disabled') + '>Copia verdetto per X</button>';
    }
    function buildSyntheticShareText() {
      var data = calculateVerdictData();
      return "Il mio verdetto sull'operato di Giovanni Manna al Napoli (maggio 2024 – novembre 2026):\n" + "Voto medio: " + data.formattedAverage + "/10 (" + data.judgment + ")\n" + "Operazioni valutate: " + data.evaluatedCount + "/" + data.totalCount + " (" + data.positiveCount + " positive, " + data.sufficientCount + " sufficienti, " + data.insufficientCount + " insufficienti)";
    }
    function showCopiedButtonState() {
      var btn = document.getElementById("copyBtn");
      if (!btn) return;
      btn.textContent = "Verdetto copiato!";
      btn.classList.add("copied");
      setTimeout(function() { var currentBtn = document.getElementById("copyBtn"); if (currentBtn) { currentBtn.textContent = "Copia verdetto per X"; currentBtn.classList.remove("copied"); } }, 2000);
    }
    function fallbackCopyText(text) {
      var textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.top = "0";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      textarea.setSelectionRange(0, 99999);
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(textarea);
      showCopiedButtonState();
    }
    function copyVerdictText() {
      var text = buildSyntheticShareText();
      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        navigator.clipboard.writeText(text).then(function() { showCopiedButtonState(); }).catch(function() { fallbackCopyText(text); });
      } else { fallbackCopyText(text); }
    }
    function initApp() { loadSavedVotes(); renderAllSessions(); renderVerdictBox(); }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initApp); else initApp();
  </script>
</body>
</html>
